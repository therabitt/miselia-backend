# ═══════════════════════════════════════════════════════════════════════════
# File    : docker-compose.yml
# Desc    : Local development stack — API + Worker + Beat + Redis + PostgreSQL.
#           Untuk production deployment, gunakan Railway (backend) — bukan compose.
#
#           Worker concurrency sesuai Blueprint §18.4:
#             worker-pipeline : queue pipeline_normal + pipeline_heavy, concurrency=4
#             worker-chat     : queue chat_realtime, concurrency=6
#             beat            : beat scheduler (satu instance saja)
#
#           Quick start:
#             docker-compose up                    # semua services
#             docker-compose up postgres redis api  # API saja tanpa worker
#
# Step    : STEP 3 (skeleton) → STEP 7 (queue routing complete)
# Ref     : Blueprint §2.1, §18.4, Project Master Document Fase 0
# ═══════════════════════════════════════════════════════════════════════════

version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: miselia-postgres
    environment:
      POSTGRES_DB: miselia_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d miselia_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: miselia-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI API ────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: api
    container_name: miselia-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/miselia_dev
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # ── Celery Worker: Pipeline (normal + heavy) ──────────────────────────
  # Blueprint §18.4: pipeline_normal (P1–P6, P8) + pipeline_heavy (P7 SLR)
  # Concurrency=4 — max 4 pipeline berjalan bersamaan (balanced CPU/memory)
  worker-pipeline:
    build:
      context: .
      target: worker
    container_name: miselia-worker-pipeline
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/miselia_dev
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: >-
      celery -A app.workers.celery_app worker
      --queues=pipeline_normal,pipeline_heavy
      --concurrency=4
      --loglevel=info
      --hostname=worker-pipeline@%h
    restart: unless-stopped

  # ── Celery Worker: Chat Realtime ───────────────────────────────────────
  # Blueprint §18.4: chat_realtime — latency-sensitive, user menunggu sinkron
  # Concurrency=6 — lebih tinggi untuk minimize queue depth
  worker-chat:
    build:
      context: .
      target: worker
    container_name: miselia-worker-chat
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/miselia_dev
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: >-
      celery -A app.workers.celery_app worker
      --queues=chat_realtime
      --concurrency=6
      --loglevel=info
      --hostname=worker-chat@%h
    restart: unless-stopped

  # ── Celery Beat (scheduler) ───────────────────────────────────────────
  # PENTING: Hanya boleh satu instance beat — duplicate akan menyebabkan
  # double-execution scheduled jobs (subscription expiry, cleanup, dll)
  # Ref: Blueprint §2.2 beat schedule, Decision #1
  beat:
    build:
      context: .
      target: worker
    container_name: miselia-beat
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/miselia_dev
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      worker-pipeline:
        condition: service_started
    volumes:
      - .:/app
    command: >-
      celery -A app.workers.celery_app beat
      --loglevel=info
      --scheduler celery.beat.PersistentScheduler
    restart: unless-stopped

volumes:
  postgres_data:
